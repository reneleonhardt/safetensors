repos:
  - repo: https://github.com/Narsil/pre-commit-rust
    rev: 2f7503ed401b0c8d854d5118a4624149fda89afc
    hooks:
      - id: fmt
        name: "Rust (fmt)"
        args: ["--manifest-path", "safetensors/Cargo.toml", "--"]
      - id: clippy
        name: "Rust (clippy)"
        args:
          [
            "--manifest-path",
            "safetensors/Cargo.toml",
            "--all-targets",
            "--",
            "-Dwarnings",
          ]
  - repo: https://github.com/Narsil/pre-commit-rust
    rev: 2f7503ed401b0c8d854d5118a4624149fda89afc
    hooks:
      - id: fmt
        name: "Python (fmt)"
        args: ["--manifest-path", "bindings/python/Cargo.toml", "--"]
      - id: clippy
        name: "Python (clippy)"
        args:
          [
            "--manifest-path",
            "bindings/python/Cargo.toml",
            "--all-targets",
            "--",
            "-Dwarnings",
          ]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.0
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format
