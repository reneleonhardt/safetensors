name: Build PR Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "bindings/python/py_src/**"
      - ".github/workflows/build_pr_documentation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_pr_documentation.yml@c69e96c087165ba49b1788e0c3464654dd60253c # maintained workflow API
    with:
      commit_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.number }}
      package: safetensors
      package_path: safetensors/bindings/python/
      version_tag_suffix: bindings/python/py_src/
      install_rust: true
      python_version: "3.14"
