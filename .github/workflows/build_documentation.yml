name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release
      - use_templates

permissions:
  contents: read

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@c69e96c087165ba49b1788e0c3464654dd60253c # maintained workflow API
    with:
      commit_sha: ${{ github.sha }}
      package: safetensors
      notebook_folder: safetensors_doc
      package_path: safetensors/bindings/python/
      version_tag_suffix: bindings/python/py_src/
      install_rust: true
      python_version: "3.14"
    secrets:
      token: ${{ secrets.HUGGINGFACE_PUSH }}
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
