name: Python

on:
  pull_request:

permissions:
  contents: read

jobs:
  build_and_test:
    name: Check everything builds & tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Lowest and highest, no version specified so that
        # new releases get automatically tested against
        version: [
          {torch: torch, python: "3.11", arch: "x64", numpy: numpy},
          {torch: torch, python: "3.14", arch: "x64", numpy: numpy}
        ]
        include:
          - os: ubuntu-latest
            version:
              torch: torch
              python: "3.14"
              numpy: numpy
          - os: macos-latest
            version:
              torch: torch
              python: "3.14"
              numpy: numpy
              arch: "arm64"
          - os: windows-11-arm
            version:
              torch: torch
              python: "3.13" # Latest stable Torch Windows ARM64 wheel ABI.
              numpy: numpy
              arch: "arm64"
    defaults:
      run:
        working-directory: ./bindings/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: "bindings/python"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.version.python }}
          architecture: ${{ matrix.version.arch }}

      - name: Lint with RustFmt
        run: cargo fmt -- --check

      - name: Lint with Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install (torch)
        if: matrix.os != 'windows-11-arm'
        run: |
          pip install ${{ matrix.version.numpy }}
          pip install ${{ matrix.version.torch }}
        shell: bash

      - name: Install (torch windows arm64)
        if: matrix.os == 'windows-11-arm'
        run: |
          pip install ${{ matrix.version.numpy }}
          pip install ${{ matrix.version.torch }} --index-url https://download.pytorch.org/whl/cpu
        shell: bash

      - name: Install (hdf5 non windows)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-dev

      - name: Install (tensorflow)
        if: matrix.os != 'windows-11-arm'
        run: |
          pip install ".[tensorflow]"
          pip install ${{ matrix.version.numpy }}
        shell: bash

      - name: Install (jax, flax)
        if: runner.os != 'Windows'
        run:
          pip install .[jax] ${{ matrix.version.numpy }}
        shell: bash

      - name: Install (mlx)
        if: matrix.os == 'macos-latest'
        run: |
          pip install .[mlx]
        shell: bash

      - name: Check style
        run: |
          pip install .[quality]
          ruff format --check .

      - name: Run tests
        if: matrix.os != 'windows-11-arm'
        run: |
          cargo test --locked
          pip install ".[testing]"
          pytest -sv tests/

      - name: Run tests (Windows arm64)
        if: matrix.os == 'windows-11-arm'
        run: |
          cargo test --locked
          pip install ".[testing]"
          pytest -sv tests/ --ignore=tests/test_tf_comparison.py

  test_s390x_big_endian:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    name: Test bigendian - S390X
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Can push to GHCR?
        id: canpush
        shell: bash
        run: |
          echo "value=${{ github.repository == 'safetensors/safetensors' && github.event.pull_request.head.repo.fork == false }}" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/safetensors/safetensors/s390x
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Login to Registry
        if: steps.canpush.outputs.value == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test big endian
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/s390x
          file: Dockerfile.s390x.test
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.canpush.outputs.value == 'true' && 'type=registry,ref=ghcr.io/safetensors/safetensors/s390x:cache,mode=max' || 'type=gha' }}
          cache-to: ${{ steps.canpush.outputs.value == 'true' && 'type=registry,ref=ghcr.io/safetensors/safetensors/s390x:cache,mode=max' || 'type=gha' }}
          push: ${{ steps.canpush.outputs.value == 'true' }}

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cargo install audit
        run: cargo install cargo-audit

      - name: Run Audit
        run: cargo audit -D warnings
        working-directory: ./bindings/python
