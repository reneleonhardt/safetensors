# Build stable-ABI wheels and separately validate free-threaded native wheels.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: x86_64
            image: manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            arch: x86
            image: manylinux_2_28_i686
            target: i686-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            image: manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest
            arch: armv7
            image: manylinux_2_31_armv7l
            target: armv7-unknown-linux-gnueabihf
          - runner: ubuntu-latest
            arch: s390x
            image: manylinux_2_28_s390x
            target: s390x-unknown-linux-gnu
          - runner: ubuntu-latest
            arch: ppc64le
            image: manylinux_2_28_ppc64le
            target: powerpc64le-unknown-linux-gnu
          - runner: ubuntu-latest
            arch: riscv64
            image: manylinux_2_39_riscv64
            manylinux: "2_31"
            target: riscv64gc-unknown-linux-gnu
        python_interpreter: ['3.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python_interpreter }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml --locked --interpreter ${{ matrix.python_interpreter }}
          manylinux: ${{ matrix.platform.manylinux || '2_28' }}
      - &test_emulation
        name: Set up test emulation
        if: runner.arch != 'ARM64' && !contains(matrix.platform.image, 'x86_64') && !contains(matrix.platform.image, 'i686')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - &test_abi3_linux
        name: Test reused abi3 wheel
        env:
          TEST_IMAGE: ${{ matrix.platform.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -w /tmp "quay.io/pypa/$TEST_IMAGE:latest" sh -ec '
            for abi in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314 cp315-cp315; do
              python="/opt/python/$abi/bin/python"
              "$python" -m pip install --no-deps /io/dist/*.whl
              "$python" -I /io/.github/scripts/test-wheel.py
            done
          '
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.arch }}-${{ matrix.python_interpreter }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            image: musllinux_1_2_x86_64
          - runner: ubuntu-latest
            target: x86
            image: musllinux_1_2_i686
          - runner: ubuntu-24.04-arm
            target: aarch64
            image: musllinux_1_2_aarch64
          - runner: ubuntu-latest
            target: armv7
            image: musllinux_1_2_armv7l
        python_interpreter: ['3.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python_interpreter }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml --locked --interpreter ${{ matrix.python_interpreter }}
          manylinux: musllinux_1_2
      - *test_emulation
      - *test_abi3_linux
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}-${{ matrix.python_interpreter }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
          - runner: windows-11-arm
            target: arm64
        python_interpreter: ['3.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.platform.target == 'arm64' && '3.13' || matrix.python_interpreter }}
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.platform.target == 'arm64' && 'aarch64-pc-windows-msvc' || matrix.platform.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml --locked --interpreter ${{ matrix.platform.target == 'arm64' && '3.13' || matrix.python_interpreter }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Test reused abi3 wheel
        shell: pwsh
        env:
          WHEEL_ARCH: ${{ matrix.platform.target }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $package = @{x64='python'; x86='pythonx86'; arm64='pythonarm64'}[$env:WHEEL_ARCH]
          $versions = (Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$package/index.json").versions
          foreach ($minor in 10..15) {
            $version = $versions | Where-Object { $_ -match "^3\.$minor\.\d+$" } | Sort-Object { [version]$_ } | Select-Object -Last 1
            if (!$version) { throw "No stable Python 3.$minor package" }
            nuget install $package -Version $version -Source https://api.nuget.org/v3/index.json -OutputDirectory "$env:RUNNER_TEMP/python" -NonInteractive
            $sdk = "$env:RUNNER_TEMP/python/$package.$version/tools/python.exe"
            uv venv --clear --python $sdk "$env:RUNNER_TEMP/wheel-test"
            $python = "$env:RUNNER_TEMP/wheel-test/Scripts/python.exe"
            uv pip install --python $python --no-deps (Get-ChildItem dist/*.whl).FullName
            & $python -I .github/scripts/test-wheel.py
          }
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}-${{ matrix.python_interpreter }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
        python_interpreter: ['3.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python_interpreter }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml --locked --interpreter ${{ matrix.python_interpreter }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Test reused abi3 wheel
        run: |
          for version in 3.10 3.11 3.12 3.13 3.14 3.15; do
            uv venv --clear --python "$version" "$RUNNER_TEMP/wheel-test"
            python="$RUNNER_TEMP/wheel-test/bin/python"
            uv pip install --python "$python" --no-deps dist/*.whl
            "$python" -I .github/scripts/test-wheel.py
          done
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.python_interpreter }}
          path: dist

  freethreaded:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc}
          - {runner: windows-latest, target: i686-pc-windows-msvc, arch: x86}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {runner: macos-15, target: aarch64-apple-darwin}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, container: quay.io/pypa/musllinux_1_2_x86_64:latest}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, container: quay.io/pypa/musllinux_1_2_aarch64:latest}
        python: ['3.14t', '3.15t']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.arch || '' }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml --locked --interpreter ${{ runner.os == 'Linux' && format('/opt/python/cp{0}-cp{0}t/bin/python', matrix.python == '3.14t' && '314' || '315') || 'python' }}
          manylinux: ${{ matrix.platform.container && 'musllinux_1_2' || '2_28' }}
          container: ${{ matrix.platform.container || '' }}
      - name: Validate free-threaded wheel
        if: ${{ !matrix.platform.container }}
        shell: bash
        run: |
          sh .github/scripts/test-freethreaded.sh
      - name: Validate free-threaded musllinux wheel
        if: matrix.platform.container
        shell: bash
        env:
          MUSL_CONTAINER: ${{ matrix.platform.container }}
          PYTHON_ABI: ${{ matrix.python == '3.14t' && 'cp314-cp314t' || 'cp315-cp315t' }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -w /io -e PYTHON_ABI "$MUSL_CONTAINER" sh -ec '
            export PATH="/opt/python/$PYTHON_ABI/bin:$PATH"
            sh .github/scripts/test-freethreaded.sh
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wheels-freethreaded-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, freethreaded, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish with trusted publishing
        if: startsWith(github.ref, 'refs/tags/') && vars.USE_TRUSTED_PUBLISHING == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && vars.USE_TRUSTED_PUBLISHING != 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
