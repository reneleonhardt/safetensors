name: Upload PR Documentation

on:
  # Pinned uploader validates the run/PR association and uploads artifacts as data.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Build PR Documentation"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: read
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    uses: huggingface/doc-builder/.github/workflows/upload_pr_documentation.yml@c69e96c087165ba49b1788e0c3464654dd60253c # maintained workflow API
    with:
      package_name: safetensors
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
      comment_bot_token: ${{ secrets.COMMENT_BOT_TOKEN }}
