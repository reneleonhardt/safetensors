version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
  - package-ecosystem: cargo
    directories:
      - /bindings/python
      - /safetensors
      - /safetensors/fuzz
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
  - package-ecosystem: npm
    directory: /.github/security-audit
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nix-inputs: {}
